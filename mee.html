<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Name - Ethan Pangilinan</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <script
    src="https://kit.fontawesome.com/5ce3789171.js"
    crossorigin="anonymous"
  ></script>
  <style>

    html {
        overflow-y: scroll;
    }

    :root {
      --primary-blue: #7aa2f7;
      --secondary-blue: #2a2f3d;
      --accent: #090c08;
      --dark-gray: #1a1b26;
      --light-gray: #f5f5f5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Space Mono", monospace;
    }

    body {
      line-height: 1.4;
      color: var(--dark-gray);
      background: var(--light-gray);
    }

    .nav-container {
        background: var(--primary-blue);
        border-bottom: 3px solid var(--secondary-blue);
        position: sticky;
        top: 0;
        z-index: 1000;
        min-height: 74px;
    }


    nav {
      max-width: 1650px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .logo {
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--light-gray);
      padding: 0.5rem 1rem;
      background: var(--secondary-blue);
      border: 2px solid var(--dark-gray);
      box-shadow: 4px 4px 0 var(--dark-gray);
    }

    .nav-items {
      display: flex;
      align-items: center;
      gap: 4rem;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
    }

    .nav-links a {
      color: var(--light-gray);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      font-weight: 600;
      position: relative;
      transition: all 0.2s ease;
    }

    .nav-links a:hover {
      transform: translateY(-2px);
      color: var(--accent);
    }

    .social-icons {
      display: flex;
      gap: 1.5rem;
      margin-left: 2rem;
    }

    .social-icons a {
      color: var(--light-gray);
      font-size: 1.4rem;
      transition: transform 0.2s ease;
    }

    .social-icons a:hover {
      transform: translateY(-2px);
    }

    .container {
      max-width: 1650px;
      margin: 0 auto;
      padding: 5rem 2rem;
      text-align: center;
    }

    .project-title {
      font-size: 3rem;
      color: var(--primary-blue);
      text-transform: uppercase;
      letter-spacing: -1px;
      text-shadow: 2px 2px 0 var(--secondary-blue);
    }

    .project-subtitle {
      font-size: 1.3rem;
      color: var(--dark-gray);
      margin-top: 1rem;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--light-gray);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.5rem;
    }

    @media (max-width: 768px) {
      .menu-toggle {
        display: block;
      }
      .nav-items {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--primary-blue);
        flex-direction: column;
        gap: 1rem;
        padding: 1.5rem 2rem;
        align-items: center;
      }
      .nav-items.active {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <div class="nav-container" id="nav-placeholder"></div>

  <div class="container">
    <h1 class="project-title">WIP</h1>
    <p class="project-subtitle">// Please stay tuned!</p>

    <a href="index.html#projects" class="back-btn">← Back</a>

    <style>
    .back-btn {
        display: inline-block;
        background: #f0f0f0;
        text-decoration: none;
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 16px;
        font-family: inherit;
        color: black;
    }
    .back-btn:hover {
        background: #e0e0e0;
    }
    </style>


  </div>

  <script src="script.js"></script>

</body>
</html>
