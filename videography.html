<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videography - Ethan Pangilinan</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/5ce3789171.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/videography.css" />
</head>
<body>

    <div class="nav-container" id="nav-placeholder"></div>

    <div class="container">
        <header class="page-header">
            <h1 class="page-title">Visual Showcase</h1>
            <a href="https://www.youtube.com/@EthanPangilinan" target="_blank" class="yt-btn">
                <i class="fab fa-youtube"></i> EthanPangilinan Channel
            </a>
        </header>
        <!-- Rows are generated from `videoSections` below by js/videography.js -->
    </div>

    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <iframe id="modalPlayer" width="100%" height="100%" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

    <!-- ====================================================================
         PAGE CONTENT
         Add a video by adding one entry to the right section. The thumbnail
         defaults to the YouTube still; set `thumb` to override it.
         Field reference is documented at the top of js/videography.js.
         ==================================================================== -->
    <script>
        const videoSections = [
            {
                title: "// Standard Drone & Hobby",
                videos: [
                    {
                        id: "Z8UGumlCguc",
                        title: "Lake Side Carnival",
                        tags: ["Standard Drone", "Hobby"]
                    },
                    {
                        id: "d-sie87f9ZU",
                        title: "Small City Sprout",
                        tags: ["Standard Drone", "Hobby"]
                    },
                    {
                        id: "LEIFUtGaAkU",
                        title: "Wedding Videography // Carmela and Pascal.",
                        thumb: "assets/videography/Wedding Videography.png",
                        thumbAlt: "Wedding Videography Client Showcase",
                        tags: ["Standard Drone", "Client", { label: "Raw Footage", raw: true }]
                    },
                    {
                        id: "vNdtEnVy-4U",
                        title: "Wesea Metal Industries | Showcase",
                        tags: ["Standard Drone", "Commercial"]
                    }
                ]
            },
            {
                title: "// Real Estate & Commercial",
                videos: [
                    {
                        id: "QZDJGg7_Zj4",
                        title: "Aerial Real Estate Showcase",
                        tags: ["Real Estate", "Client"]
                    },
                    {
                        id: "1gbOfdNmJtE",
                        title: "Property Showcase (BermanMedia.ca)",
                        tags: ["Shorts", "Real Estate", { label: "Raw Footage", raw: true }]
                    },
                    {
                        id: "x9xbs49vB0Q",
                        title: "Calgary Varsity Estates Showcase (BermanMedia.ca)",
                        tags: ["Shorts", "Real Estate", { label: "Raw Footage", raw: true }]
                    }
                ]
            },
            {
                title: "// FPV Cinematography",
                videos: [
                    {
                        id: "cI7H_ggdovc",
                        title: "Sunset Soarin'",
                        tags: ["FPV", "Hobby", "Action"]
                    }
                ]
            }
        ];
    </script>

    <script src="js/nav.js"></script>
    <script src="js/videography.js"></script>

</body>
</html>
